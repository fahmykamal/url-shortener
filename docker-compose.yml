services:
  redis:
    image: redis
    container_name: url-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build: .
    container_name: url-shortener-api
    ports:
      - "5076:8080"
    environment:
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
