<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: ui-monospace, "Courier New", monospace;
            background: #0e100f;
            color: #fffce1;
            max-width: 720px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: -150px; right: -150px;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: #0ae448;
            filter: blur(160px);
            opacity: 0.08;
            pointer-events: none;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brace { color: #fffce1; font-size: 24px; opacity: 0.5; line-height: 1; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7c7c6f;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #7c7c6f;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status.ok .status-dot {
            background: #0ae448;
            box-shadow: 0 0 10px #0ae448;
            animation: pulse 2s infinite;
        }

        .status.down .status-dot {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        h3 {
            margin: 2.5rem 0 0.75rem;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7c7c6f;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        h3::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e1e1e;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1.5rem;
            background: #141514;
            border: 1px solid #232323;
            border-radius: 16px;
        }

        .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

        .row label {
            min-width: 130px;
            font-size: 12px;
            color: #9a9a8c;
        }

        input, select {
            padding: 0.7rem 0.9rem;
            background: #0e100f;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #fffce1;
            font-family: inherit;
            font-size: 13px;
            flex: 1;
            min-width: 150px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: #0ae448; }

        button {
            padding: 0.75rem 1.5rem;
            background: #0ae448;
            color: #0e100f;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            align-self: flex-start;
        }

        button:hover { transform: scale(1.04); box-shadow: 0 0 24px rgba(10, 228, 72, 0.3); }

        .result-label {
            margin-top: 2rem;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7c7c6f;
        }

        pre {
            background: #141514;
            border: 1px solid #232323;
            padding: 1.25rem;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
            color: #abff84;
            margin-top: 0.75rem;
        }

        pre.error { color: #ff6b6b; border-color: #3a1e1e; }

        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1e1e1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #7c7c6f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer a {
            color: #0ae448;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        footer a:hover { opacity: 0.75; }
    </style>
</head>
<body>
    <div class="top">
        <h2><span class="brace">{</span> url shortener <span class="brace">}</span></h2>
        <span class="status" id="statusBadge"><span class="status-dot"></span> checking</span>
    </div>

    <h3>shorten a url</h3>
    <form id="shortenForm">
        <div class="row">
            <label for="urlInput">URL</label>
            <input type="url" id="urlInput" placeholder="https://example.com" required>
        </div>
        <div class="row">
            <label for="customCode">Custom code</label>
            <input type="text" id="customCode" placeholder="optional — e.g. my-link">
        </div>
        <div class="row">
            <label for="expiresIn">Expires in</label>
            <select id="expiresIn">
                <option value="">Never</option>
                <option value="1">1 hour</option>
                <option value="24">24 hours</option>
                <option value="72">3 days</option>
                <option value="168">7 days</option>
            </select>
        </div>
        <button type="submit">Shorten</button>
    </form>

    <h3>resolve a short code</h3>
    <form id="resolveForm">
        <div class="row">
            <label for="codeInput">Code</label>
            <input type="text" id="codeInput" placeholder="e.g. 14c6b6a" required>
        </div>
        <button type="submit">Resolve</button>
    </form>

    <p class="result-label">result</p>
    <pre id="result">// waiting for input...</pre>

    <footer>
        <span>&copy; 2026 Ahmad Fahmi</span>
        <a href="https://fahmykamal.site/url-shortener.html" target="_blank" rel="noopener">about this project &rarr;</a>
    </footer>

    <script>
        const statusBadge = document.getElementById('statusBadge');

        async function checkHealth() {
            try {
                const res = await fetch('/health', { cache: 'no-store' });
                const ok = res.ok;
                statusBadge.className = 'status ' + (ok ? 'ok' : 'down');
                statusBadge.innerHTML = `<span class="status-dot"></span> ${ok ? 'live' : 'degraded'}`;
            } catch {
                statusBadge.className = 'status down';
                statusBadge.innerHTML = '<span class="status-dot"></span> offline';
            }
        }

        checkHealth();
        setInterval(checkHealth, 30000);

        document.getElementById('shortenForm').onsubmit = async (e) => {
            e.preventDefault();
            const body = { url: document.getElementById('urlInput').value };
            const customCode = document.getElementById('customCode').value.trim();
            const expiresIn = document.getElementById('expiresIn').value;
            if (customCode) body.customCode = customCode;
            if (expiresIn) body.expiresInHours = parseInt(expiresIn);

            const res = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            document.getElementById('result').className = res.ok ? '' : 'error';
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        };

        document.getElementById('resolveForm').onsubmit = async (e) => {
            e.preventDefault();
            const code = document.getElementById('codeInput').value;
            const res = await fetch('/stats/' + code);
            const data = await res.json();
            document.getElementById('result').className = res.ok ? '' : 'error';
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        };
    </script>
</body>
</html>
