<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h2 { margin-bottom: 24px; }
        h3 { margin-top: 32px; margin-bottom: 8px; }
        form { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .row label { min-width: 100px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 150px; }
        button { padding: 8px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; }
        .error { color: #cc0000; }
    </style>
</head>
<body>
    <h2>URL Shortener</h2>

    <h3>Shorten a URL</h3>
    <form id="shortenForm">
        <div class="row">
            <label for="urlInput">URL</label>
            <input type="url" id="urlInput" placeholder="https://example.com" required>
        </div>
        <div class="row">
            <label for="customCode">Custom code (optional)</label>
            <input type="text" id="customCode" placeholder="e.g. my-link">
        </div>
        <div class="row">
            <label for="expiresIn">Expires in</label>
            <select id="expiresIn">
                <option value="">Never</option>
                <option value="1">1 hour</option>
                <option value="24">24 hours</option>
                <option value="72">3 days</option>
                <option value="168">7 days</option>
            </select>
        </div>
        <button type="submit">Shorten</button>
    </form>

    <h3>Resolve a short code</h3>
    <form id="resolveForm">
        <div class="row">
            <label for="codeInput">Code</label>
            <input type="text" id="codeInput" placeholder="e.g. 14c6b6a" required>
        </div>
        <button type="submit">Resolve</button>
    </form>

    <h4>Result:</h4>
    <pre id="result"></pre>

    <script>
        document.getElementById('shortenForm').onsubmit = async (e) => {
            e.preventDefault();
            const body = { url: document.getElementById('urlInput').value };
            const customCode = document.getElementById('customCode').value.trim();
            const expiresIn = document.getElementById('expiresIn').value;
            if (customCode) body.customCode = customCode;
            if (expiresIn) body.expiresInHours = parseInt(expiresIn);

            const res = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            document.getElementById('result').className = res.ok ? '' : 'error';
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        };

        document.getElementById('resolveForm').onsubmit = async (e) => {
            e.preventDefault();
            const code = document.getElementById('codeInput').value;
            const res = await fetch('/stats/' + code);
            const data = await res.json();
            document.getElementById('result').className = res.ok ? '' : 'error';
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        };
    </script>
</body>
</html>
